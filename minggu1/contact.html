<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farel Juliansyah | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>Farel Juliansyah</h2>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>

<section>
    <h1 class="section-title">Contact Me</h1>

    <form class="contact-form">

        <div class="form-group">
            <label for="nama">Nama Lengkap</label>

            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama lengkap"
                required>
        </div>


        <div class="form-group">
            <label for="email">Alamat Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="contoh@email.com"
                required>
        </div>


        <div class="form-group">
            <label for="kategori">Kategori / Keperluan</label>

            <select id="kategori" name="kategori">
                <option value="konsultasi">Konsultasi</option>
                <option value="kolaborasi">Kolaborasi Proyek</option>
                <option value="pertanyaan">Pertanyaan Umum</option>
            </select>
        </div>


        <div class="form-group">
            <label for="pesan">Pesan</label>

            <textarea
                id="pesan"
                name="pesan"
                rows="5"
                placeholder="Tuliskan pesan kamu..."
                required></textarea>
        </div>


        <div class="form-group">
            <label for="telepon">Nomor Telepon</label>

            <input
                type="tel"
                id="telepon"
                name="telepon"
                placeholder="Masukkan nomor telepon">
        </div>


        <button type="submit">Kirim Pesan</button>

    </form>
</section>

</main>

<footer>
    <p>&copy; 2026 Farel Juliansyah. All Rights Reserved.</p>
</footer>

</body>
</html>
