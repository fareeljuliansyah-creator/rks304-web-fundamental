<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Informatics System</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen bg-cover bg-center bg-fixed"
    style="background-image: linear-gradient(rgba(3,10,20,0.88), rgba(3,10,20,0.92)), url('background.svg');"
>

    <div class="min-h-screen flex items-center justify-center p-6">

        <div class="w-full max-w-xl">

            <!-- Logo / Judul -->
            <div class="text-center mb-6">

                <div class="inline-flex items-center justify-center
                            w-16 h-16 rounded-2xl
                            bg-blue-600 text-white
                            text-2xl font-bold shadow-lg mb-4">
                    &lt;/&gt;
                </div>

                <h1 class="text-3xl font-bold text-white">
                    Informatics System
                </h1>

                <p class="text-gray-400 mt-2">
                    Create your account
                </p>

            </div>


            <!-- Form Card -->
            <div class="bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-7">

                <form
                    action="dashboard.html"
                    method="GET"
                    id="registerForm"
                    novalidate
                >

                    <!-- Username -->
                    <div class="mb-4">

                        <label
                            for="username"
                            class="block text-sm font-semibold text-gray-700 mb-2"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Masukkan username"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300
                                   focus:outline-none focus:ring-2 focus:ring-blue-500
                                   focus:border-blue-500"
                        >

                        <p
                            id="usernameError"
                            class="text-red-500 text-sm mt-1"
                        ></p>

                    </div>


                    <!-- Password -->
                    <div class="mb-4">

                        <label
                            for="password"
                            class="block text-sm font-semibold text-gray-700 mb-2"
                        >
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimal 8 karakter"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300
                                   focus:outline-none focus:ring-2 focus:ring-blue-500
                                   focus:border-blue-500"
                        >

                        <p
                            id="passwordError"
                            class="text-red-500 text-sm mt-1"
                        ></p>

                    </div>


                    <!-- Nama -->
                    <div class="mb-4">

                        <label
                            for="nama"
                            class="block text-sm font-semibold text-gray-700 mb-2"
                        >
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            id="nama"
                            name="nama"
                            placeholder="Masukkan nama lengkap"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300
                                   focus:outline-none focus:ring-2 focus:ring-blue-500
                                   focus:border-blue-500"
                        >

                        <p
                            id="namaError"
                            class="text-red-500 text-sm mt-1"
                        ></p>

                    </div>


                    <!-- Tanggal Lahir -->
                    <div class="mb-4">

                        <label
                            for="tanggalLahir"
                            class="block text-sm font-semibold text-gray-700 mb-2"
                        >
                            Tanggal Lahir
                        </label>

                        <input
                            type="date"
                            id="tanggalLahir"
                            name="tanggalLahir"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300
                                   focus:outline-none focus:ring-2 focus:ring-blue-500
                                   focus:border-blue-500"
                        >

                        <p
                            id="tanggalLahirError"
                            class="text-red-500 text-sm mt-1"
                        ></p>

                    </div>


                    <!-- Alamat -->
                    <div class="mb-4">

                        <label
                            for="alamat"
                            class="block text-sm font-semibold text-gray-700 mb-2"
                        >
                            Alamat
                        </label>

                        <textarea
                            id="alamat"
                            name="alamat"
                            rows="3"
                            placeholder="Masukkan alamat lengkap"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300
                                   focus:outline-none focus:ring-2 focus:ring-blue-500
                                   focus:border-blue-500"
                        ></textarea>

                        <p
                            id="alamatError"
                            class="text-red-500 text-sm mt-1"
                        ></p>

                    </div>


                    <!-- Nomor Telepon -->
                    <div class="mb-6">

                        <label
                            for="telepon"
                            class="block text-sm font-semibold text-gray-700 mb-2"
                        >
                            Nomor Telepon
                        </label>

                        <input
                            type="tel"
                            id="telepon"
                            name="telepon"
                            placeholder="Contoh: 628123456789"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300
                                   focus:outline-none focus:ring-2 focus:ring-blue-500
                                   focus:border-blue-500"
                        >

                        <p
                            id="teleponError"
                            class="text-red-500 text-sm mt-1"
                        ></p>

                    </div>


                    <!-- Button -->
                    <button
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700
                               text-white font-semibold py-3 rounded-lg
                               transition duration-200 shadow-lg"
                    >
                        Create Account
                    </button>

                </form>

            </div>


            <p class="text-center text-gray-500 text-sm mt-5">
                Informatics & Cyber Technology
            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="validasi_input.js"></script>

</body>
</html>
