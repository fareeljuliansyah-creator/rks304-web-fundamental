<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Admin Panel</h1>
      <span class="text-sm text-slate-300">Administrator</span>
    </div>
  </header>

  <nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-6 flex flex-wrap gap-6 py-4">
      <a href="dashboard.html" class="text-slate-600 hover:text-blue-600">Dashboard</a>
      <a href="products.html" class="text-blue-600 font-semibold">Products</a>
      <a href="dashboard.html" class="text-slate-600 hover:text-blue-600">Users</a>
      <a href="dashboard.html" class="text-slate-600 hover:text-blue-600">Setting</a>
      <a href="index.html" class="text-red-600">Logout</a>
    </div>
  </nav>

  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">

    <div class="flex justify-between items-center mb-6">
      <h2 class="text-3xl font-bold text-slate-800">Manajemen Produk</h2>

      <a href="add-produk.html"
         class="bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700">
        Add Product
      </a>
    </div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-slate-800 text-white">
          <tr>
            <th class="px-6 py-4">No</th>
            <th class="px-6 py-4">Name</th>
            <th class="px-6 py-4">Stock</th>
            <th class="px-6 py-4">Action</th>
          </tr>
        </thead>

        <tbody class="divide-y">
          <tr>
            <td class="px-6 py-4">1</td>
            <td class="px-6 py-4">Laptop Lenovo</td>
            <td class="px-6 py-4">15</td>
            <td class="px-6 py-4 space-x-2">
              <a href="edit-produk.html"
                 class="bg-yellow-500 text-white px-3 py-2 rounded">
                Edit
              </a>
              <button class="bg-red-600 text-white px-3 py-2 rounded">
                Delete
              </button>
            </td>
          </tr>

          <tr>
            <td class="px-6 py-4">2</td>
            <td class="px-6 py-4">Mouse Wireless</td>
            <td class="px-6 py-4">30</td>
            <td class="px-6 py-4 space-x-2">
              <a href="edit-produk.html"
                 class="bg-yellow-500 text-white px-3 py-2 rounded">
                Edit
              </a>
              <button class="bg-red-600 text-white px-3 py-2 rounded">
                Delete
              </button>
            </td>
          </tr>

          <tr>
            <td class="px-6 py-4">3</td>
            <td class="px-6 py-4">Keyboard Mechanical</td>
            <td class="px-6 py-4">20</td>
            <td class="px-6 py-4 space-x-2">
              <a href="edit-produk.html"
                 class="bg-yellow-500 text-white px-3 py-2 rounded">
                Edit
              </a>
              <button class="bg-red-600 text-white px-3 py-2 rounded">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <footer class="bg-slate-900 text-slate-300 text-center py-4">
    <p>&copy; 2026 Admin Panel. All rights reserved.</p>
  </footer>

</body>
</html>
